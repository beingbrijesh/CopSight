name: CI CopSight AI (macOS)

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'copsight-macos/**'
      - '.github/workflows/copsight-macos.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'copsight-macos/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-copsight-macos:
    name: Build & Verify CopSight AI (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build CopSight AI Application Bundle
        shell: bash
        run: |
          cd copsight-macos
          chmod +x build_app.sh
          ./build_app.sh --release "1.0.0"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CopSight-AI-macOS-CI
          path: |
            copsight-macos/dist/CopSight-AI-macOS-*.dmg
            copsight-macos/dist/CopSight-AI-macOS-*.zip
