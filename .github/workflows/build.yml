name: Build Executables

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'forensixd-v*'
      - 'v2.*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. 2.0.30)'
        required: false
        default: '2.0.30'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libcairo2-dev

    - name: Install System Dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install pkg-config cairo

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller Pillow
        pip install -e .
      # Assuming your project has a setup.py or pyproject.toml
      # If you use requirements.txt instead, you can uncomment the line below:
      # pip install -r requirements.txt

    - name: Inject Production URL
      shell: bash
      run: |
        python -c "import os; f = 'forensixd/constants.py'; content = open(f).read().replace('INJECTED_STREAM_URL', os.environ.get('PROD_SERVER_URL', '')).replace('INJECTED_LOGIN_URL', os.environ.get('PROD_FRONTEND_URL', '')); open(f, 'w').write(content)"
        if [ -n "$PROD_SERVER_URL" ]; then
          echo "VITE_API_URL=${PROD_SERVER_URL}/api" >> apps/macos/.env
          echo "VITE_STREAM_URL=${PROD_SERVER_URL}" >> apps/macos/.env
        fi
      env:
        PROD_SERVER_URL: ${{ secrets.PROD_SERVER_URL }}
        PROD_FRONTEND_URL: ${{ secrets['PROD_FRONTEND_URL'] }}

    - name: Download Android Platform Tools
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          curl -L "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -o platform-tools.zip
          unzip platform-tools.zip
        elif [ "$RUNNER_OS" == "macOS" ]; then
          curl -L "https://dl.google.com/android/repository/platform-tools-latest-darwin.zip" -o platform-tools.zip
          unzip platform-tools.zip
        else
          curl -L "https://dl.google.com/android/repository/platform-tools-latest-linux.zip" -o platform-tools.zip
          unzip platform-tools.zip
        fi

    - name: Extract Version
      id: extract_version
      shell: bash
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
          VERSION="${{ github.event.inputs.version }}"
        elif [[ "${{ github.ref }}" =~ ^refs/tags/forensixd-v ]]; then
          VERSION="${GITHUB_REF#refs/tags/forensixd-v}"
        elif [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
          VERSION="${GITHUB_REF#refs/tags/v}"
        else
          VERSION=$(grep '^version = ' pyproject.toml | cut -d '"' -f 2)
        fi
        echo "APP_VERSION=v$VERSION" >> $GITHUB_ENV

    - name: Build with PyInstaller
      shell: bash
      run: pyinstaller forensixd.spec --noconfirm

    - name: Prepare Release Assets
      shell: bash
      run: |
        cd dist
        if [ "$RUNNER_OS" == "Linux" ]; then
          mv forensixd forensixd-linux-amd64-$APP_VERSION
          chmod +x forensixd-linux-amd64-$APP_VERSION
        elif [ "$RUNNER_OS" == "Windows" ]; then
          mv forensixd.exe forensixd-windows-amd64-$APP_VERSION.exe
        elif [ "$RUNNER_OS" == "macOS" ]; then
          cp forensixd forensixd-macos-universal-$APP_VERSION
          chmod +x forensixd-macos-universal-$APP_VERSION
          cd ..
          cd apps/macos && npm install
          cd ../..
          python3 apps/macos/scripts/build_macos_app.py "$APP_VERSION"
          cd dist
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: forensixd-${{ runner.os }}-${{ env.APP_VERSION }}
        path: |
          dist/forensixd*
          dist/ForensixD*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/forensixd-') || startsWith(github.ref, 'refs/tags/v2.') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: forensixd-*
          merge-multiple: true

      - name: List artifacts
        run: ls -R release-artifacts

      - name: Determine Release Tag
        id: rel_tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/ ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="forensixd-v${{ github.event.inputs.version || '2.0.30' }}"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ForensixD Extractor & CLI ${{ env.RELEASE_TAG }} — Hardware Data Acquisition Tool
          generate_release_notes: true
          body: |
            ## ⚡ ForensixD by CopSight — Hardware Data Extraction Tool & CLI (${{ env.RELEASE_TAG }})

            This release provides the standalone **ForensixD by CopSight** extraction station for macOS and the **ForensixD CLI by CopsightAI** cross-platform forensic engine for Linux, Windows, and macOS.

            ---

            ### 📦 Download Packages

            | Package | Target OS | Description | Asset Name |
            |:---|:---|:---|:---|
            | **ForensixD macOS Extractor** | macOS 11.0+ | Native Cocoa GUI Acquisition Station | `ForensixD-Extractor-macOS-v2.0.30.dmg` / `.zip` |
            | **ForensixD CLI (Linux)** | Linux x86_64 | Standalone CLI Ingestion Binary | `forensixd-linux-amd64-v2.0.30` |
            | **ForensixD CLI (Windows)** | Windows x86_64 | Standalone CLI Ingestion Executable | `forensixd-windows-amd64-v2.0.30.exe` |
            | **ForensixD CLI (macOS)** | macOS Universal | Standalone CLI Ingestion Binary | `forensixd-macos-universal-v2.0.30` |

            ---

            ### 🖥️ ForensixD macOS Extractor Changelog
            - **Rebranding & Identity**: Rebranded bundle to `ForensixD by CopSight.app` with native Cocoa menus and high-DPI 128px icon layout.
            - **IO Clearance Scope Enforcement**: Removed out-of-scope administrator diagnostics and log dossiers from the field extraction station to preserve operational focus for Investigating Officers (IO).
            - **Hardware Bus Radar**: Real-time USB probe supporting Android (ADB/EDL/Fastboot), MediaTek BROM, and iOS physical/logical triage.
            - **Section 65B & DFXML Hash Verification**: Automated SHA-256 block-level verification with live waveform bitstream acquisition console.
            - **Encrypted Evidence Vault**: Direct export of court-admissible UFDR containers and Section 65B compliance dossiers.

            ---

            ### ⚙️ ForensixD CLI Tool Changelog
            - **Identity & Terminal Shell**: Rebranded binary CLI to `forensixd CLI by CopsightAI` with updated `--version` metadata (`v2.0.30`) and interactive terminal banner.
            - **Cross-Platform Standalone Binaries**: Pre-compiled standalone executables for Linux (x86_64), Windows (x86_64), and macOS (Universal).
            - **Automated Ingestion Pipelines**: Direct support for headless logical, filesystem, and physical acquisition workflows.
            - **Self-Contained Platform Tools**: Bundled with embedded platform-tools for zero-dependency execution.

            ---

            ### 🚀 macOS App Installation
            1. Download **`ForensixD-Extractor-macOS-v2.0.30.dmg`** below.
            2. Double-click the `.dmg` and drag **ForensixD by CopSight.app** to your **Applications** folder.
            3. If macOS displays a Gatekeeper security prompt on first launch, open Terminal and run:
               ```bash
               xattr -cr "/Applications/ForensixD by CopSight.app"
               ```
            4. Launch **ForensixD** directly from your Applications or Dock!
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
