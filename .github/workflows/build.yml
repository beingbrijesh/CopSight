name: Build & Release Forensic Suite

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'ForensixD release version (e.g. 2.0.31)'
        required: false
        default: '2.0.31'
      copsight_version:
        description: 'CopSight AI release version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================================
  # JOB 1: Build ForensixD Extractor (macOS GUI) & ForensixD CLI (Cross-Platform)
  # ============================================================================
  build-forensixd:
    name: Build ForensixD (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libcairo2-dev

    - name: Install System Dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install pkg-config cairo

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller Pillow
        pip install -e .

    - name: Inject Production URL
      shell: bash
      run: |
        python -c "import os; f = 'forensixd/constants.py'; content = open(f).read().replace('INJECTED_STREAM_URL', os.environ.get('PROD_SERVER_URL', '')).replace('INJECTED_LOGIN_URL', os.environ.get('PROD_FRONTEND_URL', '')); open(f, 'w').write(content)"
        if [ -n "$PROD_SERVER_URL" ]; then
          echo "VITE_API_URL=${PROD_SERVER_URL}/api" >> apps/macos/.env
          echo "VITE_STREAM_URL=${PROD_SERVER_URL}" >> apps/macos/.env
        fi
      env:
        PROD_SERVER_URL: ${{ secrets.PROD_SERVER_URL }}
        PROD_FRONTEND_URL: ${{ secrets['PROD_FRONTEND_URL'] }}

    - name: Download Android Platform Tools
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          curl -L "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -o platform-tools.zip
          unzip platform-tools.zip
        elif [ "$RUNNER_OS" == "macOS" ]; then
          curl -L "https://dl.google.com/android/repository/platform-tools-latest-darwin.zip" -o platform-tools.zip
          unzip platform-tools.zip
        else
          curl -L "https://dl.google.com/android/repository/platform-tools-latest-linux.zip" -o platform-tools.zip
          unzip platform-tools.zip
        fi

    - name: Extract Version
      id: extract_version
      shell: bash
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
          VERSION="${{ github.event.inputs.version }}"
        elif [[ "${{ github.ref }}" =~ ^refs/tags/ ]]; then
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
        else
          VERSION=$(grep '^version = ' pyproject.toml | cut -d '"' -f 2)
        fi
        echo "APP_VERSION=v$VERSION" >> $GITHUB_ENV

    - name: Build with PyInstaller
      shell: bash
      run: pyinstaller forensixd.spec --noconfirm

    - name: Prepare Release Assets
      shell: bash
      run: |
        cd dist
        if [ "$RUNNER_OS" == "Linux" ]; then
          mv forensixd forensixd-linux-amd64-$APP_VERSION
          chmod +x forensixd-linux-amd64-$APP_VERSION
        elif [ "$RUNNER_OS" == "Windows" ]; then
          mv forensixd.exe forensixd-windows-amd64-$APP_VERSION.exe
        elif [ "$RUNNER_OS" == "macOS" ]; then
          cp forensixd forensixd-macos-universal-$APP_VERSION
          chmod +x forensixd-macos-universal-$APP_VERSION
          cd ..
          cd apps/macos && npm install
          cd ../..
          python3 apps/macos/scripts/build_macos_app.py "$APP_VERSION"
          cd dist
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: forensixd-${{ runner.os }}
        path: |
          dist/forensixd*
          dist/ForensixD*

  # ============================================================================
  # JOB 2: Build CopSight AI Native macOS Workstation (SwiftUI)
  # ============================================================================
  build-copsight-macos:
    name: Build CopSight AI (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Determine Application Version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.copsight_version }}" ]; then
            VERSION="${{ github.event.inputs.copsight_version }}"
          else
            VERSION="1.0.0"
          fi
          echo "COPSIGHT_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build & Package CopSight AI Application Bundle
        shell: bash
        run: |
          cd copsight-macos
          chmod +x build_app.sh
          ./build_app.sh --release "${{ env.COPSIGHT_VERSION }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: copsight-ai-macos
          path: |
            copsight-macos/dist/CopSight-AI-macOS-*.dmg
            copsight-macos/dist/CopSight-AI-macOS-*.zip

  # ============================================================================
  # JOB 3: Unified Single Release (Publishes All 3 Tools in One Place)
  # ============================================================================
  release:
    name: Publish Unified Suite Release
    needs: [build-forensixd, build-copsight-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la release-artifacts

      - name: Determine Release Tag
        id: rel_tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/ ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${{ github.event.inputs.version || '2.0.31' }}"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Create Unified GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: CopSight AI & ForensixD Suite ${{ env.RELEASE_TAG }} — Unified Forensic Intelligence Station
          generate_release_notes: true
          files: release-artifacts/*
          body: |
            ## 🛡️ CopSight AI & ForensixD Unified Forensic Suite (${{ env.RELEASE_TAG }})

            Welcome to the official release of the **CopSight AI & ForensixD Forensic Suite**. All applications, GUI field extractors, and command-line ingestion engines are provided below in a single unified release.

            ---

            ### 📦 Complete Download Matrix

            | Application / Tool | Target OS & Architecture | Role & Description | Primary Asset | Archive Asset |
            |:---|:---|:---|:---|:---|
            | **CopSight AI Workstation** | macOS 14+ (Apple Silicon) | Native SwiftUI full forensic intelligence workstation with multi-role RBAC (IO, Supervisor, Admin), AI entity correlation, and case management. | **`CopSight-AI-macOS-v1.0.0.dmg`** | `CopSight-AI-macOS-v1.0.0.zip` |
            | **ForensixD Extractor** | macOS 11+ (Intel & Apple Silicon) | Standalone hardware data extraction station for Investigating Officers (IO) with USB device radar and Section 65B hash digests. | **`ForensixD-Extractor-macOS-v2.0.31.dmg`** | `ForensixD-Extractor-macOS-v2.0.31.zip` |
            | **ForensixD CLI (Linux)** | Linux x86_64 | High-performance standalone CLI binary for automated forensic acquisition pipelines. | **`forensixd-linux-amd64-v2.0.31`** | — |
            | **ForensixD CLI (Windows)** | Windows x86_64 | High-performance standalone CLI executable for Windows forensic labs. | **`forensixd-windows-amd64-v2.0.31.exe`** | — |
            | **ForensixD CLI (macOS)** | macOS Universal (Apple Silicon & Intel) | High-performance standalone CLI binary for scriptable macOS forensic workflows. | **`forensixd-macos-universal-v2.0.31`** | — |

            ---

            ### 🔍 Software Tier Breakdown & Differentiation

            #### 1. 🛡️ CopSight AI macOS Workstation (v1.0.0)
            * **Purpose**: Full-lifecycle digital forensic analysis, case dockets, AI chat assistance, and supervisor oversight.
            * **Key Capabilities**:
              - **Native SwiftUI Performance**: Zero-latency desktop suite designed specifically for macOS Apple Silicon.
              - **Multi-Role RBAC Clearance**: Dynamic clearance routing for Investigating Officers, Supervisors, and Root System Administrators.
              - **Full-Canvas AI Analyst**: Natural language querying across chat logs, call detail records (CDR), geolocation stamps, and financial ledgers.
              - **Supervisor Audit Hub**: ISO/IEC 27037 compliant audit trails, chain of custody verification seals, and officer workload allocation.
              - **System Health Monitor**: Live hardware metrics (CPU core balance, unified RAM, Milvus vector QPS, and NVMe I/O).

            #### 2. ⚡ ForensixD by CopSight macOS App (v2.0.30)
            * **Purpose**: Dedicated, distraction-free hardware acquisition station for Investigating Officers in the field.
            * **Key Capabilities**:
              - **Strict IO Scope Enforcement**: Zero administrative bloat; exclusively tailored for hardware I/O extraction and forensic bitstream acquisition.
              - **Hardware Bus Radar**: Real-time USB bus probe supporting Android (ADB/EDL/Fastboot), MediaTek BROM, and iOS physical/logical triage.
              - **Section 65B & DFXML Hasher**: Automated SHA-256 block-level verification with live waveform bitstream acquisition console.
              - **High-DPI 128px DMG Installer**: Drag-and-drop installer with large icons for fast deployment.

            #### 3. ⚙️ ForensixD CLI Engine (v2.0.30)
            * **Purpose**: Scriptable, headless cross-platform command-line tool for automated lab pipelines.
            * **Key Capabilities**:
              - **Zero-Dependency Engine**: Bundles embedded platform tools and Python standard runtimes.
              - **Court-Admissible Export**: Direct UFDR container and DFXML XML generation.

            ---

            ### 🚀 macOS Installation & Gatekeeper Clearance

            For both **CopSight AI** and **ForensixD by CopSight** on macOS:
            1. Download the respective `.dmg` installer from the table above.
            2. Double-click the `.dmg` and drag the application icon into the **Applications** shortcut.
            3. If macOS displays a Gatekeeper prompt on first launch, run the one-time command in Terminal:
               ```bash
               # For CopSight AI Workstation:
               xattr -cr "/Applications/CopSight AI.app"

               # For ForensixD Extractor:
               xattr -cr "/Applications/ForensixD by CopSight.app"
               ```
            4. Launch your application directly from Launchpad or `/Applications`!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
